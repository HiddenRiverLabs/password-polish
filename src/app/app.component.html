<router-outlet />
<div class="container-fluid">
    <div class="row">
        <div class="col-12 mt-3 mb-5">
            <form>
                <div class="mb-3 row">
                    <label for="table-complete-search" class="col-xs-3 col-sm-auto col-form-label">Full text
                        search:</label>
                    <div class="col-xs-3 col-sm-auto">
                        <input id="table-complete-search" type="text" class="form-control" name="searchTerm"
                            [(ngModel)]="service.searchTerm" />
                    </div>
                    @if (service.loading$ | async) {
                    <span class="col col-form-label">Loading...</span>
                    }
                </div>

                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th scope="col" sortable="name" (sort)="onSort($event)">Name</th>
                            <th scope="col" sortable="username" (sort)="onSort($event)">User</th>
                            <th scope="col" sortable="password" (sort)="onSort($event)">Password</th>
                            <th scope="col" sortable="modifyTime" (sort)="onSort($event)">ModifiedTime</th>
                            <th scope="col" sortable="urls" (sort)="onSort($event)">URLs</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (login of logins$ | async; track login.name) {
                        <tr>
                            <td><ngb-highlight [result]="login.name" [term]="service.searchTerm" /></td>
                            <td><ngb-highlight [result]="login.username" [term]="service.searchTerm" /></td>
                            <td>{{ login.password ? '**********': '---' }}</td>
                            <td><ngb-highlight [result]="login.modifyTime | date: 'short'"
                                    [term]="service.searchTerm" /></td>
                            <td><ngb-highlight [result]="login.urls.toString()" [term]="service.searchTerm" /></td>
                        </tr>
                        } @empty {
                        <tr>
                            <td colspan="5" style="text-align: center">No logins found</td>
                        </tr>
                        }
                    </tbody>
                </table>

                <div class="d-flex justify-content-between p-2 mb-4">
                    <ngb-pagination [collectionSize]="(total$ | async)!" [(page)]="service.page"
                        [pageSize]="service.pageSize">
                    </ngb-pagination>

                    <select class="form-select" style="width: auto" name="pageSize" [(ngModel)]="service.pageSize">
                        <option [ngValue]="5">5 items per page</option>
                        <option [ngValue]="10">10 items per page</option>
                        <option [ngValue]="25">25 items per page</option>
                    </select>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- plus button in lower right absolute positioned -->
<button class="btn btn-danger plus-button" (click)="addLogin(content)">+</button>

<ng-template #content let-offcanvas>
    <div class="offcanvas-header">
        <h4 class="offcanvas-title">Password Import</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="offcanvas.dismiss('Cross click')"></button>
    </div>
    <div class="offcanvas-body">
        <div class="d-flex justify-content-center align-items-center">
            <div class="form-group">
                <label for="file">Select a file</label>
                <input type="file" class="form-control" id="file" accept=".pgp" (change)="fileChange($event)">
            </div>
        </div>
    </div>
</ng-template>
